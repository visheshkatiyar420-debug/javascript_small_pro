<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body{
        height: 100vh;
        width: 100%;
      font-family: Arial, sans-serif;
    }

    nav{
        background: linear-gradient(to right, #66067e, #a81283);
      
      padding: 15px 40px;
      height: 57px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    ul{
      display: flex;
      list-style: none;
      gap: 30px;
    }

    ul li a{
      color: white;
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
    }

    ul li a:hover{
      color: yellow;
    }
    img{
      border-radius: 50%;
    }
    .btn{
      border: solid 2px black;
      border-radius: 50px;
      padding: 10px 30px;
      background-color: rgb(91, 6, 124);
        color: white;
     
    }
    input{
        padding: 10px;
        border: solid 2px black;
        border-radius: 50px;
    }
    .search{
        display: flex;
        gap: 10px;
    }
   
   

  </style>
</head>

<body>

  <nav>

    <div class="logo">
      <img src="tutor.jpg.png" alt="Logo" width="50" height="50">
    </div>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    
    <div class="search">
    <input type="search" placeholder="Search..." >
    <button class="btn">Search</button>
    </div>
  </nav>
  

</body>
</html>
