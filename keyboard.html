<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;   
        }
        h3 {
            display: flex;
            font-size: 10rem;
            font-weight: bold;
            color: #999;
            
           
        }
        #main {
            background-color: #333;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <div id="main">
        <h3>V</h3>
    </div>
    <script>
      let h3 = document.querySelector("h3");
      window.addEventListener("keydown", function(dets){
        if(dets.key===" "){
            h3.textContent = "Space";
        }
        else{
           let cap =  dets.key.toUpperCase();
              h3.textContent = cap;
        }
        
      })
    

    </script>
    
    
</body>
</html>
